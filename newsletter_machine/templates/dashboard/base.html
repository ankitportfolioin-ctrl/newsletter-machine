<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newsletter Machine — {{ title | default('dashboard') }}</title>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<style>
body { font-family: Arial, Helvetica, sans-serif; max-width: 960px; margin: 0 auto; padding: 16px; color: #18181b; }
nav a { margin-right: 12px; }
table { border-collapse: collapse; width: 100%; margin-top: 12px; }
th, td { border: 1px solid #d4d4d8; padding: 6px 8px; font-size: 13px; text-align: left; vertical-align: top; }
th { background: #f4f4f5; }
code, pre { font-size: 12px; }
form.inline { display: inline; }
.cards { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.card { border: 1px solid #d4d4d8; border-radius: 8px; padding: 12px 16px; min-width: 120px; }
.card b { font-size: 24px; display: block; }
.meta { color: #52525b; font-size: 12px; }
iframe.preview { width: 100%; height: 80vh; border: 1px solid #d4d4d8; }
</style>
</head>
<body>
<nav>
<a href="/dashboard?token={{ token }}">Home</a>
<a href="/dashboard/niches?token={{ token }}">Niches</a>
<a href="/dashboard/sources?token={{ token }}">Sources</a>
<a href="/dashboard/runs?token={{ token }}">Runs</a>
<a href="/dashboard/newsletters?token={{ token }}">Newsletters</a>
<a href="/dashboard/feedback?token={{ token }}">Feedback</a>
</nav>
<hr>
{% block body %}{% endblock %}
<p class="meta">Token auth via ?token= (dev-grade — use localhost or a TLS proxy).</p>
</body>
</html>
