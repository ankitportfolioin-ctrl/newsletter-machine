<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Newsletter Machine — {{ title | default('dashboard') }}</title>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
<style>
:root {
  --bg: #fafafa;
  --bg-elevated: #ffffff;
  --fg: #18181b;
  --fg-muted: #71717a;
  --border: #e4e4e7;
  --border-strong: #d4d4d8;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --accent-soft: #eff6ff;
  --danger: #dc2626;
  --danger-hover: #b91c1c;
  --danger-soft: #fef2f2;
  --success: #16a34a;
  --success-soft: #f0fdf4;
  --warning: #ea580c;
  --warning-soft: #fff7ed;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.06), 0 2px 4px -2px rgba(0,0,0,0.04);
  --radius: 8px;
  --radius-lg: 12px;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #09090b;
    --bg-elevated: #18181b;
    --fg: #fafafa;
    --fg-muted: #a1a1aa;
    --border: #27272a;
    --border-strong: #3f3f46;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --accent-soft: #1e3a5f;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --danger-soft: #450a0a;
    --success: #22c55e;
    --success-soft: #052e16;
    --warning: #f97316;
    --warning-soft: #431407;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
    --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 1px 2px rgba(0,0,0,0.2);
    --shadow-lg: 0 4px 6px -1px rgba(0,0,0,0.3), 0 2px 4px -2px rgba(0,0,0,0.2);
  }
}

* {
  box-sizing: border-box;
}

html {
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  margin: 0;
  padding: 0;
  min-height: 100vh;
}

a {
  color: var(--accent);
  text-decoration: none;
  transition: color 0.15s ease;
}

a:hover {
  color: var(--accent-hover);
}

code {
  font-family: var(--font-mono);
  font-size: 0.875em;
  background: var(--border);
  padding: 0.125em 0.375em;
  border-radius: 4px;
}

pre {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: var(--space-3);
  overflow-x: auto;
  line-height: 1.5;
}

pre code {
  background: none;
  padding: 0;
  font-size: inherit;
}

h1, h2, h3 {
  font-weight: 600;
  line-height: 1.3;
  color: var(--fg);
  margin: 0 0 var(--space-3);
}

h1 { font-size: 1.75rem; }
h2 { font-size: 1.375rem; }
h3 { font-size: 1.125rem; }

.meta {
  color: var(--fg-muted);
  font-size: 0.75rem;
  line-height: 1.5;
}

.badge {
  display: inline-flex;
  align-items: center;
  font-size: 0.6875rem;
  font-weight: 500;
  padding: 0.125rem 0.5rem;
  border-radius: 9999px;
  background: var(--accent-soft);
  color: var(--accent);
  white-space: nowrap;
}

.badge--success { background: var(--success-soft); color: var(--success); }
.badge--warning { background: var(--warning-soft); color: var(--warning); }
.badge--danger { background: var(--danger-soft); color: var(--danger); }
.badge--neutral { background: var(--border); color: var(--fg-muted); }

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  padding: var(--space-4) 0;
  border-bottom: 1px solid var(--border);
  margin-bottom: var(--space-5);
}

.nav a {
  display: inline-flex;
  align-items: center;
  padding: var(--space-1) var(--space-3);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--fg-muted);
  border-radius: var(--radius);
  transition: all 0.15s ease;
}

.nav a:hover {
  color: var(--fg);
  background: var(--accent-soft);
}

.nav a.active {
  color: var(--accent);
  background: var(--accent-soft);
}

.card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  box-shadow: var(--shadow-sm);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}

.card:hover {
  box-shadow: var(--shadow);
  border-color: var(--border-strong);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-3);
  padding-bottom: var(--space-3);
  border-bottom: 1px solid var(--border);
}

.card-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--fg);
  margin: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  font-size: 0.8125rem;
  font-weight: 500;
  padding: var(--space-2) var(--space-4);
  border-radius: var(--radius);
  border: 1px solid transparent;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
  text-decoration: none;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.btn--primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

.btn--primary:hover:not(:disabled) {
  background: var(--accent-hover);
}

.btn--secondary {
  background: var(--bg-elevated);
  color: var(--fg);
  border-color: var(--border);
}

.btn--secondary:hover:not(:disabled) {
  background: var(--bg);
  border-color: var(--border-strong);
}

.btn--ghost {
  background: transparent;
  color: var(--fg-muted);
  border-color: transparent;
}

.btn--ghost:hover:not(:disabled) {
  color: var(--fg);
  background: var(--border);
}

.btn--danger {
  background: var(--danger);
  color: white;
  border-color: var(--danger);
}

.btn--danger:hover:not(:disabled) {
  background: var(--danger-hover);
}

.btn--sm {
  padding: var(--space-1) var(--space-3);
  font-size: 0.75rem;
}

.btn--lg {
  padding: var(--space-3) var(--space-5);
  font-size: 0.9375rem;
}

.form-group {
  margin-bottom: var(--space-4);
}

.form-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--fg);
  margin-bottom: var(--space-1);
}

.form-input,
.form-select,
.form-textarea {
  width: 100%;
  font-size: 0.875rem;
  font-family: inherit;
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--fg);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.form-input:focus,
.form-select:focus,
.form-textarea:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.form-input::placeholder {
  color: var(--fg-muted);
}

.form-row {
  display: flex;
  gap: var(--space-4);
}

.form-row > * {
  flex: 1;
}

.table-wrapper {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8125rem;
}

th, td {
  padding: var(--space-2) var(--space-3);
  text-align: left;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}

th {
  font-weight: 600;
  color: var(--fg-muted);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.025em;
  background: var(--bg);
  position: sticky;
  top: 0;
}

tr:last-child td {
  border-bottom: none;
}

tr:hover td {
  background: var(--accent-soft);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: var(--space-4);
}

.stat-card {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: var(--space-4);
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}

.stat-card:hover {
  box-shadow: var(--shadow);
  border-color: var(--border-strong);
}

.stat-value {
  font-size: 2rem;
  font-weight: 700;
  color: var(--fg);
  line-height: 1.2;
  margin: 0 0 var(--space-1);
}

.stat-label {
  font-size: 0.75rem;
  color: var(--fg-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  font-weight: 500;
}

.form-actions {
  display: flex;
  gap: var(--space-3);
  padding-top: var(--space-4);
  border-top: 1px solid var(--border);
  margin-top: var(--space-5);
}

.empty-state {
  text-align: center;
  padding: var(--space-6) var(--space-4);
  color: var(--fg-muted);
}

.empty-state svg {
  width: 48px;
  height: 48px;
  margin-bottom: var(--space-3);
  opacity: 0.5;
}

.empty-state p {
  margin: 0 0 var(--space-3);
  font-size: 1rem;
}

.toast {
  position: fixed;
  bottom: var(--space-4);
  right: var(--space-4);
  padding: var(--space-3) var(--space-4);
  border-radius: var(--radius);
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  font-size: 0.875rem;
  z-index: 1000;
  animation: slide-up 0.2s ease;
}

@keyframes slide-up {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}
</style>
</head>
<body>
<nav class="nav" aria-label="Main navigation">
<a href="/dashboard?token={{ token }}" class="{% if request.path == '/dashboard' %}active{% endif %}">Dashboard</a>
<a href="/dashboard/niches?token={{ token }}" class="{% if request.path == '/dashboard/niches' %}active{% endif %}">Niches</a>
<a href="/dashboard/sources?token={{ token }}" class="{% if request.path == '/dashboard/sources' %}active{% endif %}">Sources</a>
<a href="/dashboard/runs?token={{ token }}" class="{% if request.path == '/dashboard/runs' %}active{% endif %}">Runs</a>
<a href="/dashboard/newsletters?token={{ token }}" class="{% if request.path == '/dashboard/newsletters' %}active{% endif %}">Newsletters</a>
<a href="/dashboard/feedback?token={{ token }}" class="{% if request.path == '/dashboard/feedback' %}active{% endif %}">Feedback</a>
</nav>
<hr style="border: none; border-top: 1px solid var(--border); margin-bottom: var(--space-5);">
{% block body %}{% endblock %}
<p class="meta" style="margin-top: var(--space-6); padding-top: var(--space-4); border-top: 1px solid var(--border);">Token auth via ?token= (dev-grade — use localhost or a TLS proxy).</p>
</body>
</html>
