[project]
name = "newsletter-machine"
version = "0.1.0"
description = "Daily multi-platform newsletter generator: collect, rank, cluster, analyze, compose, deliver."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Newsletter Machine" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.8",
  "tenacity>=8.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "apscheduler>=3.10",
  "jinja2>=3.1",
  "premailer>=3.10",
  "typer>=0.12",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "rich>=13.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.1",
  "playwright>=1.63.0",
  "slowapi>=0.1.9",
]

[tool.vercel]
entrypoint = "newsletter_machine.api.main:app"

[project.optional-dependencies]
playwright-fallback = ["playwright>=1.44"]

[project.scripts]
newsletter-machine = "newsletter_machine.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-playwright>=0.5",
  "pytest-xdist>=3.0",
  "respx>=0.22",
  "ruff>=0.4",
  "httpx>=0.27",
]
e2e = [
  "pytest-playwright>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsletter_machine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
markers = [
    "e2e: marks tests as end-to-end (require running services)",
]

[tool.pytest-playwright]
browsers = ["chromium", "firefox", "webkit"]
headless = true
base_url = "http://localhost:8000"
trace = "on-first-retry"
video = "retain-on-failure"
screenshot = "only-on-failure"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 (function call in default arg) is FastAPI's documented Depends() pattern, not a bug.
ignore = ["B008"]

[tool.alembic]
script_location = "newsletter_machine/db/migrations"
